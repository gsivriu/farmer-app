name: Supabase Dev Keepalive

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dev Supabase REST API
        env:
          SUPABASE_URL: https://eirqbksgxiiudgeezlob.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" -o /dev/null
          echo "Ping OK at $(date -u +%FT%TZ)"
